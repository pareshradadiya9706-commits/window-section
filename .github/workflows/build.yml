name: Build Final APK - Capacitor
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Unzip Project
        run: |
          rm -rf app
          unzip -o "*.zip" -d app

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web + Make APK with Capacitor
        run: |
          PKG=$(find app -name "package.json" | head -n 1)
          DIR=$(dirname "$PKG")
          cd "$DIR"
          echo "Building in $DIR"
          rm -rf node_modules package-lock.json
          npm install
          npm run build
          ls dist

          # Capacitor install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Window Section" com.windowsection.app --web-dir=dist
          npx cap add android
          npx cap copy android

          cd android
          chmod +x gradlew
         ./gradlew assembleDebug
          ls app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: window-section-final-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
