name: Build Web App
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Unzip
        run: |
          rm -rf app
          unzip -o "*.zip" -d app
          ls -la app

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Build Backend
        run: |
          REQ=$(find app -name "requirements.txt" | head -n 1)
          echo "Found $REQ"
          pip install -r $REQ

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          PKG=$(find app -name "package.json" | head -n 1)
          DIR=$(dirname "$PKG")
          echo "Frontend at $DIR"
          cd "$DIR"
          rm -rf node_modules package-lock.json
          npm install
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app
