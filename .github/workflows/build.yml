name: Build Web App
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Unzip and List
        run: |
          unzip -o "*.zip"
          ls -la
          echo "--- Finding pubspec.yaml ---"
          find. -name "pubspec.yaml" || echo "Flutter project NOT FOUND"

      - name: Build Python Backend Check
        run: |
          cd $(find. -name "requirements.txt" | head -n 1 | xargs dirname)
          pip install -r requirements.txt
          python -m pytest || echo "Tests done"

      - name: Build React Frontend
        run: |
          FRONTEND_DIR=$(find. -name "package.json" | head -n 1 | xargs dirname)
          echo "Frontend at $FRONTEND_DIR"
          cd $FRONTEND_DIR
          npm install
          npm run build
