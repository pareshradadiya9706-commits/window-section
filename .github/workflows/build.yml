name: Build APK from ZIP
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Unzip and Find Project
        run: |
          unzip -o "*.zip"
          echo "--- All files ---"
          ls -R | head -n 100
          PROJECT_DIR=$(find. -name "pubspec.yaml" | head -n 1 | xargs dirname)
          echo "Found Flutter project at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Build APK
        run: |
          cd "${{ env.PROJECT_DIR }}"
          flutter pub get
          flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: window-section-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
