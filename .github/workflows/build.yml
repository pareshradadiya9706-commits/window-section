name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Unzip
        run: |
          rm -rf app
          unzip -o *.zip -d app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          PKG=$(find app -name package.json | head -n 1)
          DIR=$(dirname $PKG)
          cd $DIR
          npm install
          npm run build
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init WindowSection com.windowsection.app --web-dir=dist
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/app.apk
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: window-section-final
          path: /tmp/app.apk
